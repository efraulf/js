<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-loop-övning</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        button { padding: 10px 20px; margin-bottom: 20px; }
        pre { background: #f4f4f4; padding: 10px; }
    </style>
</head>
<body>
    <h1>JS-övning: For-loop och While-loop</h1>

    <p>Skriv kod för att skriva ut alla jämna tal mellan 1 och 20.</p>

    <h2>For-loop</h2>
    <textarea id="forLoopCode">
// Skriv din for-loop här
</textarea>

    <h2>While-loop</h2>
    <textarea id="whileLoopCode">
// Skriv din while-loop här
</textarea>

    <button onclick="runCode()">Kör koden</button>

    <h2>Resultat:</h2>
    <pre id="output"></pre>

    <script>
        function runCode() {
            const outputElement = document.getElementById("output");
            outputElement.textContent = ""; // Rensa tidigare resultat

            const forCode = document.getElementById("forLoopCode").value;
            const whileCode = document.getElementById("whileLoopCode").value;

            // Funktion för att fånga console.log
            const logs = [];
            const originalConsoleLog = console.log;
            console.log = function(...args) {
                logs.push(args.join(" "));
                originalConsoleLog.apply(console, args);
            }

            try {
                // Kör for-loop koden
                eval(forCode);
                console.log("---"); // separator
                // Kör while-loop koden
                eval(whileCode);
            } catch (e) {
                logs.push("Fel i koden: " + e.message);
            }

            // Återställ console.log
            console.log = originalConsoleLog;

            outputElement.textContent = logs.join("\n");
        }
    </script>
</body>
</html>
